<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 230px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      border-radius: 12px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(148, 163, 184, 0.15);
      color: var(--text-muted);
    }

    .badge-status.active {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-green);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .badge-status.active .dot {
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .stats-card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-number {
      font-size: 26px;
      font-weight: 800;
      color: var(--accent-blue);
      line-height: 1;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .speed-select {
      display: flex;
      gap: 4px;
      background: var(--card-bg);
      padding: 3px;
      border-radius: 8px;
      margin-bottom: 4px;
    }

    .speed-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      padding: 5px 0;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .speed-btn.active {
      background: var(--accent-blue);
      color: white;
    }

    .btn-main {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn-main:active { transform: scale(0.98); }

    #startBtn {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
    }

    #stopBtn {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
      display: none;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .reset-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      cursor: pointer;
      text-decoration: underline;
    }

    .reset-btn:hover { color: var(--text-main); }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">Naukri Clicker</span>
    <span id="statusBadge" class="badge-status">
      <span class="dot"></span><span id="statusText">Idle</span>
    </span>
  </div>

  <div class="stats-card">
    <div id="clickCount" class="stat-number">0</div>
    <div class="stat-label">Interests Shared</div>
  </div>

  <div class="speed-select">
    <button class="speed-btn" data-speed="fast">Fast</button>
    <button class="speed-btn active" data-speed="medium">Med</button>
    <button class="speed-btn" data-speed="safe">Safe</button>
  </div>

  <div class="controls">
    <button id="startBtn" class="btn-main">▶ Start Auto Clicker</button>
    <button id="stopBtn" class="btn-main">■ Stop</button>
  </div>

  <div class="footer">
    <button id="resetBtn" class="reset-btn">Reset count</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
